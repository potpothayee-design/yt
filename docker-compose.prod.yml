# Production overlay:  docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d
# Adds PostgreSQL, named volumes and stricter settings. Put this stack behind
# Cloudflare (proxied DNS) or any TLS-terminating CDN in front of `frontend`.
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: studio
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set-in-env}
      POSTGRES_DB: studio
    volumes:
      - pg-data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U studio"]
      interval: 10s
      timeout: 5s
      retries: 10

  backend:
    environment:
      DATABASE_URL: postgresql+psycopg2://studio:${POSTGRES_PASSWORD}@db:5432/studio
      CORS_ORIGINS: ${PUBLIC_ORIGIN:-*}
    depends_on:
      db:
        condition: service_healthy

volumes:
  pg-data:
