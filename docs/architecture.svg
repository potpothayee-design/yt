<svg xmlns="http://www.w3.org/2000/svg" width="980" height="700" viewBox="0 0 980 700" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#64748b"/>
    </marker>
    <linearGradient id="fe" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1e293b"/><stop offset="1" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="be" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1220"/><stop offset="1" stop-color="#111827"/>
    </linearGradient>
  </defs>
  <rect width="980" height="700" fill="#f8fafc"/>

  <!-- ===================== FRONTEND ===================== -->
  <rect x="120" y="28" width="740" height="92" rx="14" fill="url(#fe)" stroke="#6366f1" stroke-width="2"/>
  <text x="490" y="56" text-anchor="middle" font-size="17" font-weight="700" fill="#e2e8f0">Browser — Next.js dashboard</text>
  <text x="490" y="78" text-anchor="middle" font-size="12" fill="#94a3b8">React 19 · TypeScript · Tailwind (dark mode)</text>
  <text x="490" y="99" text-anchor="middle" font-size="12" fill="#a5b4fc">Dashboard │ Projects │ Generator │ Assets │ Uploads │ Settings │ Logs │ API Keys</text>

  <!-- arrow FE->BE -->
  <line x1="490" y1="120" x2="490" y2="150" stroke="#64748b" stroke-width="2.5" marker-end="url(#arrow)"/>
  <rect x="352" y="126" width="276" height="20" rx="10" fill="#eef2ff" stroke="#c7d2fe"/>
  <text x="490" y="140" text-anchor="middle" font-size="11" fill="#4338ca">same-origin /backend/* (rewrites proxy) · JWT</text>

  <!-- ===================== BACKEND ===================== -->
  <rect x="40" y="152" width="900" height="402" rx="16" fill="url(#be)" stroke="#334155" stroke-width="2"/>
  <text x="490" y="178" text-anchor="middle" font-size="16" font-weight="700" fill="#e2e8f0">FastAPI backend (uvicorn)</text>

  <!-- API layer -->
  <rect x="70" y="192" width="840" height="52" rx="10" fill="#0f172a" stroke="#475569"/>
  <text x="84" y="212" font-size="12.5" font-weight="700" fill="#93c5fd">api/v1</text>
  <text x="84" y="232" font-size="12" fill="#cbd5e1">auth · projects · jobs · assets · uploads · settings · logs · youtube · meta</text>

  <!-- API -> orchestrator/pipeline/registry -->
  <line x1="260" y1="244" x2="260" y2="270" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="490" y1="244" x2="490" y2="270" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="720" y1="244" x2="720" y2="270" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Orchestrator -->
  <rect x="115" y="272" width="290" height="66" rx="10" fill="#1c1917" stroke="#f59e0b"/>
  <text x="260" y="298" text-anchor="middle" font-size="13.5" font-weight="700" fill="#fcd34d">Orchestrator</text>
  <text x="260" y="318" text-anchor="middle" font-size="11.5" fill="#e7e5e4">jobs · progress · resume · cancel · GH dispatch</text>

  <!-- Pipeline engine -->
  <rect x="345" y="272" width="290" height="66" rx="10" fill="#172554" stroke="#3b82f6"/>
  <text x="490" y="296" text-anchor="middle" font-size="13.5" font-weight="700" fill="#93c5fd">Pipeline Engine — 12 steps</text>
  <text x="490" y="315" text-anchor="middle" font-size="11" fill="#bfdbfe">research→script→storyboard→prompts→images→voice→</text>
  <text x="490" y="330" text-anchor="middle" font-size="11" fill="#bfdbfe">video→music→captions→edit→thumbs→preview</text>

  <!-- Provider registry -->
  <rect x="575" y="272" width="290" height="66" rx="10" fill="#052e16" stroke="#22c55e"/>
  <text x="720" y="298" text-anchor="middle" font-size="13.5" font-weight="700" fill="#86efac">Provider Registry</text>
  <text x="720" y="318" text-anchor="middle" font-size="11.5" fill="#bbf7d0">text · image · video · voice · music (local + external)</text>

  <!-- Row 2 arrows -->
  <line x1="260" y1="338" x2="260" y2="364" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="490" y1="338" x2="490" y2="364" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="720" y1="338" x2="720" y2="364" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- DB -->
  <rect x="115" y="366" width="290" height="62" rx="10" fill="#111827" stroke="#8b5cf6"/>
  <text x="260" y="390" text-anchor="middle" font-size="13" font-weight="700" fill="#c4b5fd">SQLAlchemy 2.0</text>
  <text x="260" y="410" text-anchor="middle" font-size="11.5" fill="#ddd6fe">SQLite (dev) · PostgreSQL (prod)</text>

  <!-- Rendering -->
  <rect x="345" y="366" width="290" height="62" rx="10" fill="#111827" stroke="#ec4899"/>
  <text x="490" y="390" text-anchor="middle" font-size="13" font-weight="700" fill="#f9a8d4">Rendering</text>
  <text x="490" y="410" text-anchor="middle" font-size="11.5" fill="#fbcfe8">ffmpeg composer · karaoke captions · thumbnails</text>

  <!-- External AI APIs -->
  <rect x="575" y="366" width="290" height="62" rx="10" fill="#111827" stroke="#14b8a6"/>
  <text x="720" y="390" text-anchor="middle" font-size="13" font-weight="700" fill="#5eead4">External AI APIs (optional)</text>
  <text x="720" y="410" text-anchor="middle" font-size="11" fill="#99f6e4">OpenAI · Anthropic · Stability · ElevenLabs · Google TTS · Pika · Runway</text>

  <!-- Rendering -> ffmpeg -->
  <line x1="490" y1="428" x2="490" y2="452" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="345" y="454" width="290" height="44" rx="10" fill="#0f172a" stroke="#64748b"/>
  <text x="490" y="481" text-anchor="middle" font-size="12.5" fill="#e2e8f0">ffmpeg (bundled via imageio-ffmpeg)</text>

  <!-- Storage + YouTube -->
  <rect x="85" y="510" width="380" height="34" rx="9" fill="#0f172a" stroke="#38bdf8"/>
  <text x="275" y="531" text-anchor="middle" font-size="12" fill="#bae6fd">storage — local volume · AWS S3 · Cloudflare R2</text>
  <rect x="515" y="510" width="380" height="34" rx="9" fill="#0f172a" stroke="#f87171"/>
  <text x="705" y="531" text-anchor="middle" font-size="12" fill="#fecaca">youtube — OAuth 2.0 · Data API v3 · resumable uploads (user-approved only)</text>

  <!-- ===================== GITHUB ACTIONS ===================== -->
  <!-- callback arrow : GH -> backend (upwards, dashed) -->
  <line x1="490" y1="614" x2="490" y2="560" stroke="#64748b" stroke-width="2.5" stroke-dasharray="7 5" marker-end="url(#arrow)"/>
  <rect x="318" y="574" width="344" height="20" rx="10" fill="#fef3c7" stroke="#fde68a"/>
  <text x="490" y="588" text-anchor="middle" font-size="11" fill="#92400e">POST /api/v1/jobs/callback/{id} — progress + artifacts (X-Job-Token)</text>

  <rect x="120" y="614" width="740" height="64" rx="14" fill="#ffffff" stroke="#94a3b8" stroke-width="2"/>
  <text x="490" y="640" text-anchor="middle" font-size="14" font-weight="700" fill="#0f172a">GitHub Actions — generate.yml (optional long-running render runner)</text>
  <text x="490" y="662" text-anchor="middle" font-size="11.5" fill="#475569">python -m app.workers.runner --standalone --topic "…" --callback-url "…" → artifacts uploaded</text>
</svg>
